# Dev preview on the DEPLOYED site (ui.themes-devices, seo.family, site.qa-signin): after a push to main, wait for the
# deployed build to carry the commit, then the SEO family contract and the UI crawl (dark/light, phone/desktop, the demo
# persona signed in). Its own workflow so that a failing smoke spec never hides it.
name: Dev preview live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-preview-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: https://www.orazaka.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for the deployed build to carry this commit
        run: |
          short="${GITHUB_SHA::7}"; ok=0
          for i in $(seq 1 180); do
            # five answers in a row carry the sha: a rolling deploy serves old and new instances side by side
            if curl -fsS "$E2E_BASE_URL/api/healthz" | grep -q "$short"; then ok=$((ok+1)); else ok=0; fi
            if [ "$ok" -ge 5 ]; then echo "deployed: $short"; exit 0; fi
            echo "waiting for $short ($i/180, $ok in a row)"; sleep 10
          done
          echo "the site never showed $short" >&2; exit 1
      - run: npx --yes pnpm@10 install --frozen-lockfile --ignore-scripts
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: SEO family contract (indexed)
        run: node scripts/check-seo-family.mjs --base https://www.orazaka.com --host https://www.orazaka.com
      - name: Console gate (admin.gated) — a GitHub runner is not an allowed address
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' https://admin.orazaka.com/login)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' https://admin.orazaka.com/)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' https://www.orazaka.com/console)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' https://admin.orazaka.com/api/healthz)" = 200
      - name: UI crawl
        run: npm run test:ui-crawl
        env:
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
