# Builds and tests orazaka-web-client inside the Orazaka workspace (every upstream repository is
# built from source at its default branch), then publishes to GitHub Packages on a v* tag.
# The pipeline itself lives in krizaka/orazaka so every repository is checked the same way.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    permissions:
      contents: read
      packages: write
      # The shared component pipeline publishes npm packages with provenance (OIDC): a reusable
      # workflow cannot be granted more than its caller holds, so its absence fails at startup.
      id-token: write
    uses: krizaka/orazaka/.github/workflows/component.yml@8a08ec05315fdfed5edba0f6a60edca9da89a0b4 # main (fix/component-duplicate-permissions, krizaka/orazaka#250)
    with:
      component: orazaka-web-client
    secrets: inherit
