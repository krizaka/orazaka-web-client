# The videos of the Download page (krizaka/.github#315): every night, and on demand, the showcase journeys are recorded on the live
# site as the demo persona, then the org's app-videos workflow transcodes, uploads to Bunny and opens one PR. Never required, so it
# cannot block a merge (a stale video is caught by the page's guard). No workflow_run trigger (it would run with secrets after code
# it did not choose) and no secrets: inherit (krizaka/.github#372, Scorecard Dangerous-Workflow).
name: Download videos

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase-web:
    name: Showcase videos (web)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx --yes pnpm@10 install --frozen-lockfile --ignore-scripts
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Record the journeys (the demo persona, off camera sign-in)
        run: node scripts/showcase-web.mjs "$GITHUB_WORKSPACE/showcase-web" --base https://www.orazaka.com
        env:
          ORAZAKA_USER_EMAIL: ${{ secrets.E2E_USER }}
          ORAZAKA_USER_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-web
          path: showcase-web
          retention-days: 7

  app-videos:
    name: Download page videos
    needs: [showcase-web]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: krizaka/.github/.github/workflows/app-videos.yml@4749d988b400b5a184f2e2216946c50f9d9b5e98 # main (krizaka/.github#316)
    with:
      product: orazaka
      manifest: content/app-videos.json
      artifacts: |
        showcase-web
    secrets:
      MEDIA_STORAGE_API_KEY: ${{ secrets.MEDIA_STORAGE_API_KEY }}
      MEDIA_STORAGE_ZONE: ${{ secrets.MEDIA_STORAGE_ZONE }}
      MEDIA_STORAGE_ENDPOINT: ${{ secrets.MEDIA_STORAGE_ENDPOINT }}
      MEDIA_CDN_HOSTNAME: ${{ secrets.MEDIA_CDN_HOSTNAME }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
