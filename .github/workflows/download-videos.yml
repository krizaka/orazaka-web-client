# The videos of the Download page (krizaka/.github#315): every night, and on demand, the showcase journeys are recorded on the live
# site as the demo persona, then the org's app-videos workflow transcodes, uploads to Bunny and opens one PR. Never required, so it
# cannot block a merge (a stale video is caught by the page's guard). No workflow_run trigger (it would run with secrets after code
# it did not choose) and no secrets: inherit (krizaka/.github#372, Scorecard Dangerous-Workflow).
name: Download videos

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The free preflight (no model call): a recorded chat is a PAID run, so the persona's sign-ins, the tool the prompt needs and
  # (with a DigitalOcean token) the rollback guard are proved first. Red = no recording, no spend (orazaka-ai-engine#169).
  preflight:
    name: Preflight (free)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/videos-preflight.mjs --base https://www.orazaka.com
        env:
          ORAZAKA_USER_EMAIL: ${{ secrets.E2E_USER }}
          ORAZAKA_USER_PASSWORD: ${{ secrets.E2E_PASSWORD }}

  showcase-web:
    name: Showcase videos (web)
    needs: [preflight]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx --yes pnpm@10 install --frozen-lockfile --ignore-scripts
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Record the journeys (the demo persona, off camera sign-in)
        run: node scripts/showcase-web.mjs "$GITHUB_WORKSPACE/showcase-web" --base https://www.orazaka.com
        env:
          ORAZAKA_USER_EMAIL: ${{ secrets.E2E_USER }}
          ORAZAKA_USER_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-web
          path: showcase-web
          retention-days: 7

  # The Mac app's film (krizaka-internal#230): the journey of krizaka/orazaka apps/desktop on a macOS runner, called as a reusable
  # workflow so its artifact `showcase-mac` is in this run. On main only; never required; a failure must not take the web videos down.
  showcase-mac:
    name: Showcase video (Mac)
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: krizaka/orazaka/.github/workflows/desktop-film.yml@ed8ffc5263a237e83bca8b9e9a8aa60f173b8745 # feat/desktop-film (krizaka/orazaka#531): re-pin to the merged commit

  app-videos:
    name: Download page videos
    needs: [showcase-web, showcase-mac]
    # The Mac film failing (a runner, a build) must not hold the web videos back.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.showcase-web.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    uses: krizaka/.github/.github/workflows/app-videos.yml@8b8ba2244f8348479fe6b85f245049da036195d2 # main (krizaka/.github#425: the action pinned to sites/<product>/download)
    with:
      product: orazaka
      manifest: content/app-videos.json
      artifacts: |
        showcase-web
        showcase-mac
    secrets:
      MEDIA_STORAGE_API_KEY: ${{ secrets.MEDIA_STORAGE_API_KEY }}
      MEDIA_STORAGE_ZONE: ${{ secrets.MEDIA_STORAGE_ZONE }}
      MEDIA_STORAGE_ENDPOINT: ${{ secrets.MEDIA_STORAGE_ENDPOINT }}
      MEDIA_CDN_HOSTNAME: ${{ secrets.MEDIA_CDN_HOSTNAME }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
