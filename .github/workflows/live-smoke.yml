# After a push to main: wait for the deployed site to carry this commit (the bar shows `v<version>+<sha>`), then run the live smoke
# of e2e/live-smoke.spec.ts against it, in Chromium, WebKit and Firefox — what a visitor gets, not `next dev`.
name: Live smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BASE_URL: https://dev.orazaka.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the deployed build to carry this commit
        run: |
          short="${GITHUB_SHA::7}"; ok=0
          for i in $(seq 1 180); do
            # five answers in a row carry the sha: a rolling deploy serves old and new instances side by side
            if curl -fsS "$E2E_BASE_URL/" | grep -q "$short"; then ok=$((ok+1)); else ok=0; fi
            if [ "$ok" -ge 5 ]; then echo "deployed: $short"; exit 0; fi
            echo "waiting for $short ($i/180, $ok in a row)"; sleep 10
          done
          echo "the site never showed $short" >&2; exit 1
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npx playwright test e2e/live-smoke.spec.ts --reporter=github
