# Dependabot: the Krizaka model (monthly, ONE grouped pull request per ecosystem; krizaka/.github#510 cap of 3 open PRs).
# `all` takes every update, majors and workflow pins included, so a run never opens a PR per dependency.
# Security fixes stay on and arrive grouped apart. Auto-merge is the shared workflow of krizaka/.github (minor and patch, CI green).
# The ignore rules below are decisions, not oversights.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Paris
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Node majors are a decision, not a bump: LTS only (22/24), moved by hand
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @tanstack/* comes with @krizaka/query (its facade, krizaka-ui ADR-001), pinned exactly there: a bump here alone
      # installs a second react-query and the pages lose their QueryClient (#398). It moves when @krizaka/query moves.
      - dependency-name: "@tanstack/*"
      # pinned for the whole UI workspace by the overrides of krizaka/orazaka (orazaka-apps/ui); bumped there, together
      - dependency-name: "react"
      # same as react
      - dependency-name: "react-dom"
      # TypeScript 7 (native compiler) waits for @krizaka/config and typescript-eslint (krizaka-ui#141)
      - dependency-name: "typescript"
        versions: [">=7"]
      # types of the Node LTS we run (22/24), never a non-LTS line
      - dependency-name: "@types/node"
        versions: [">=25"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
