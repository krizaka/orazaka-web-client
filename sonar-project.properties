# Read by the component pipeline's SonarCloud step (krizaka/orazaka component.yml, `sonar: true`), run from this repository's
# folder in the workspace after `npm run validate` wrote coverage/lcov.info (jest).
sonar.projectKey=krizaka_orazaka-web-client
sonar.organization=krizaka
sonar.sources=src
sonar.tests=src,tests,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,e2e/**,tests/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Parallel by construction: the EN/FR catalogues share their keys (one block per language) and model-compare is a data table of runs.
sonar.cpd.exclusions=src/core/context/translations*.ts,src/features/landing/utils/model-compare.ts
