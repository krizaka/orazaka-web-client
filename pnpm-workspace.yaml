# The dependencies allowed to run their install scripts. Recent pnpm refuses unlisted build scripts
# (ERR_PNPM_IGNORED_BUILDS), which broke the DigitalOcean build since 2026-10-24.
# `allowBuilds` is the current key; `onlyBuiltDependencies` is kept for older pnpm versions.
allowBuilds:
  "@ast-grep/cli": true
  "@parcel/watcher": true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@krizaka/fonts@0.5.0"
  - "@krizaka/intl@0.4.0 || 0.4.1"
  - "@krizaka/tailwind@3.65.0"
  - "@krizaka/tokens@3.65.0"
  - "@krizaka/ui@3.65.0"
  - "@krizaka/query@0.2.2"
  - "@krizaka/config@0.9.1 || 0.10.0 || 0.11.0 || 0.11.1 || 0.12.0"
  - "@krizaka/a11y-audit@0.2.0"
  - "@krizaka/page-audit@0.3.1"
  - "@krizaka/auth@0.10.0"
onlyBuiltDependencies:
  - "@ast-grep/cli"
  - "@parcel/watcher"
  - unrs-resolver
