# The dependencies allowed to run their install scripts. Recent pnpm refuses unlisted build scripts
# (ERR_PNPM_IGNORED_BUILDS), which broke the DigitalOcean build since 2026-10-24.
# `allowBuilds` is the current key; `onlyBuiltDependencies` is kept for older pnpm versions.
allowBuilds:
  "@ast-grep/cli": true
  "@parcel/watcher": true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@ast-grep/cli"
  - "@parcel/watcher"
  - unrs-resolver
